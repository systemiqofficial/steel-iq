<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steel production by route</title>
<style>__COMMON_CSS__</style>
</head>
<body>
<div id="err"></div>
<script>
window.addEventListener("error", function(e) {
  const el = document.getElementById("err");
  el.style.display = "block";
  el.textContent = "Load error: " + (e.message || e.type) + (e.filename ? " @ " + e.lineno : "");
}, true);
</script>
<div class="toolbar">
  <div>
    <label class="inline"><input type="checkbox" id="share-toggle">Show as share of steel production</label>
  </div>
</div>
<div class="toolbar" id="shared-filters"></div>
<div id="summary"></div>
<div id="chart"></div>
<script>__PLOTLYJS__</script>
<script>
const CONFIG = __CONFIG__;
const DATA = __DATA__;
</script>
<script>__COMMON_JS__</script>
<script>
const MAX_WIDTH = 1280, MAX_HEIGHT = 720;
const MARGIN = {l: 70, t: 90, b: 60};  // right margin is sized per render to fit the legend
const FILL_ALPHA = 0.9;
const T = Interactive.theme;

function render() {
  const {width: WIDTH, height: HEIGHT} = Interactive.plotSize(MAX_WIDTH, MAX_HEIGHT);
  const run = DATA[Interactive.run()];
  const share = document.getElementById("share-toggle").checked;
  const selectedGeo = Interactive.selectedGeos(), selectedTech = Interactive.selectedTechs();
  const gd = document.getElementById("chart");

  const years = [...new Set(run.rows.map(r => r.y))].sort((a, b) => a - b);
  const yearIdx = new Map(years.map((y, i) => [y, i]));
  const series = new Map();  // route -> Mt per year
  const totals = years.map(() => 0);
  run.rows.filter(r => selectedGeo.has(r.g) && selectedTech.has(r.t)).forEach(r => {
    if (!series.has(r.r)) series.set(r.r, years.map(() => 0));
    series.get(r.r)[yearIdx.get(r.y)] += r.v;
    totals[yearIdx.get(r.y)] += r.v;
  });

  // Stack bottom to top in the config's route order; unknown routes (none expected) follow it.
  const order = CONFIG.routeOrder;
  const rank = route => order.includes(route) ? order.indexOf(route) : order.length;
  const routes = [...series.keys()].filter(k => series.get(k).some(v => v !== 0))
    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  if (!routes.length) {
    Interactive.showEmpty(gd, "No steel production for this selection", WIDTH, HEIGHT);
    Interactive.summary("0 Mt");
    return;
  }
  const colours = Interactive.colourTable(CONFIG.routeColours, routes);

  const traces = routes.map((route, i) => ({
    type: "scatter", mode: "lines", x: years, y: series.get(route), name: route,
    legendrank: 1000 - i, stackgroup: "routes", groupnorm: share ? "percent" : "",
    line: {width: 0, color: colours[route]}, fillcolor: Interactive.hexToRgba(colours[route], FILL_ALPHA),
    customdata: series.get(route).map((v, j) => totals[j] ? [v, 100 * v / totals[j]] : [v, 0]),
    hovertemplate: share ? "%{customdata[1]:.1f}% (%{customdata[0]:.0f} Mt)" : "%{customdata[0]:.0f} Mt (%{customdata[1]:.1f}%)",
  }));
  // Hover-only total; the unified hover orders items by legendrank, so it lists last.
  traces.push({type: "scatter", mode: "lines", x: years, y: totals, name: "Total", yaxis: "y",
    line: {width: 0}, visible: share ? false : true, showlegend: false, legendrank: 3000,
    hovertemplate: "<b>%{y:.0f} Mt</b>"});

  const runGeos = new Set(run.rows.map(r => r.g));
  const subtitle = [run.title, Interactive.geoNote(runGeos)].join(" · ");
  const margin = {...MARGIN, r: 12 + Interactive.legendWidth(routes)};
  const layout = {
    title: {text: `Steel production by route<br><sup>${subtitle}</sup>`, font: {color: T.ink, size: 17}, x: 0.05},
    xaxis: {title: {text: "Year"}, range: [years[0], years[years.length - 1]], dtick: years.length > 12 ? 5 : 1,
            gridcolor: T.grid, zeroline: false,
            showspikes: true, spikemode: "across", spikethickness: 1, spikecolor: T.inkSecondary},
    yaxis: {title: {text: share ? "Share of steel production (%)" : "Steel production (Mt)"},
            gridcolor: T.grid, rangemode: "tozero", ...(share ? {range: [0, 100]} : {})},
    legend: {x: 1.01, xanchor: "left", y: 1, yanchor: "top", font: {size: 11}, bgcolor: T.surface},
    hovermode: "x unified",
    hoverlabel: {align: "left", font: {size: 11}, bgcolor: "#fff"},
    font: {family: "Helvetica Neue, Helvetica, Arial", color: T.inkSecondary, size: 11},
    paper_bgcolor: T.surface, plot_bgcolor: T.surface,
    width: WIDTH, height: HEIGHT, margin,
  };
  Plotly.react(gd, traces, layout, {displaylogo: false, responsive: false});

  const last = years.length - 1;
  const nCountries = new Set(Interactive.geoKeys().map(Interactive.isoOf)).size;
  const selCountries = new Set([...selectedGeo].map(Interactive.isoOf)).size;
  const allTechs = new Set(run.rows.map(r => r.t)).size;
  Interactive.summary(
    `${selCountries} of ${nCountries} countries · ${selectedTech.size} of ${allTechs} steel furnaces · ` +
    `${totals[last].toFixed(0)} Mt of steel in ${years[last]}\n${run.provenance}`);
}

document.getElementById("share-toggle").addEventListener("change", render);
const allRows = Object.values(DATA).flatMap(d => d.rows);
Interactive.init({geoKeys: allRows.map(r => r.g), techs: allRows.map(r => r.t), onChange: render});
Interactive.onResize(render);
render();
</script>
</body>
</html>

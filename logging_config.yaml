version: 1
global_level: WARNING

features:
  furnace_group_breakdown: true

modules:
  geo: INFO
  pam: INFO
  tm: INFO

function_overrides:
  # Suppress noisy functions
  calculate_unit_production_cost: WARNING
  extract_price_from_costcurve: WARNING
  generate_input_effectiveness_mapping_from_feedstocks: ERROR
  # Input/output cost debug logging:
  calculate_variable_opex: DEBUG
  set_energy_costs: DEBUG
  set_input_cost_in_furnace_groups: DEBUG
  unit_vopex: DEBUG
  get_bom_from_avg_boms: DEBUG
  # Energy subsidy debug logging:
  get_subsidised_energy_costs: DEBUG
  calculate_energy_price_with_subsidies: DEBUG
  set_subsidised_energy_costs: DEBUG
  calculate_cost_breakdown_by_feedstock: DEBUG
  calculate_cost_adjustments_from_secondary_outputs: DEBUG
  # Data prep unit conversion debugging
  _process_row: DEBUG

external:
  pyomo: ERROR
version: 1
global_level: WARNING

features:
  furnace_group_breakdown: true

modules:
  geo: INFO
  pam: INFO
  tm: INFO

function_overrides:
  # Suppress noisy PAM functions
  calculate_unit_production_cost: WARNING
  extract_price_from_costcurve: WARNING
  generate_input_effectiveness_mapping_from_feedstocks: ERROR
  evaluate_expansion: WARNING
  evaluate_expansion_options: WARNING
  evaluate_furnace_group_strategy: WARNING
  run: INFO
  # Secondary feedstock conversion comparison
  calculate_variable_opex: DEBUG
  get_bom_from_avg_boms: DEBUG
  # Data prep only (not used during simulation)
  _process_row: DEBUG

external:
  pyomo: ERROR
